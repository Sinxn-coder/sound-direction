; ESP32-S3 target for the sound-direction core.
;
; Live INMP441 direction (default):
;   pio run -e esp32-s3 -t upload && pio device monitor
; Stage 2 self-test with synthetic buffers (no mics needed):
;   pio run -e esp32-s3-selftest -t upload && pio device monitor

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The portable core lives in ../src (shared with the desktop build).
; ../src/library.json restricts it to direction/ + utils/DspUtils.cpp only.
lib_deps = symlink://../src

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DSDL_CORE_FLOAT_ACCUM

[env:esp32-s3]
build_src_filter = +<*> -<selftest_main.cpp>

[env:esp32-s3-selftest]
build_src_filter = +<selftest_main.cpp>
